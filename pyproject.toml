# 当前文件保存测试与 lint 配置；开发任务分工与入口见 AGENTS.md。

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "verified_source_boundary: explicit source-proof producer substitute for component tests; source qualification integration remains unmocked",
    "browser: 启动真实 Chromium（需先运行 python -m playwright install chromium）；用 -m \"not browser\" 可跳过",
]

[tool.ruff]
target-version = "py312"
extend-exclude = [".agents", ".claude", "docs"]

[tool.ruff.lint]
# 只查会出错的问题（未定义名、未用导入/变量、语法级问题），不强制代码风格。
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E731",  # 赋值 lambda
    "E741",  # 变量名 l / O / I
]

[tool.ruff.lint.per-file-ignores]
# 当前包内 sys.path 拼接后才能导入；若调整导入结构，同时复核此例外。
"Opus/__init__.py" = ["E402"]
