<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>首次设置 · 高校师资采集平台</title>
<style>
/*base.css*/
</style>
</head><body><main class="auth"><div class="auth-card card">
<div class="auth-brand"><span class="brand-mark"><svg class="icon" viewBox="0 0 24 24"><path d="M3 21h18M5 21V11M9.5 21V11M14.5 21V11M19 21V11M2.5 11 12 4.5 21.5 11z"/></svg></span>高校师资采集平台</div>
<h1>首次创建管理员</h1><p>此页面只能在服务器本机打开。创建管理员后，可在平台内为同事创建员工账号。</p>
<form id="setup"><label class="field"><span class="field-label">登录名（小写英文）</span><input id="username" class="input" autocomplete="username" required></label>
<label class="field"><span class="field-label">显示名称</span><input id="displayName" class="input" required></label>
<label class="field"><span class="field-label">密码（至少 12 位）</span><input id="password" class="input" type="password" autocomplete="new-password" required></label>
<label class="field"><span class="field-label">确认密码</span><input id="confirm" class="input" type="password" autocomplete="new-password" required></label>
<button type="submit" class="btn btn-primary btn-lg btn-block">创建并登录</button><p id="message" role="alert"></p></form></div></main>
<script>document.getElementById('setup').addEventListener('submit',async event=>{event.preventDefault();const password=document.getElementById('password').value;if(password!==document.getElementById('confirm').value){document.getElementById('message').textContent='两次密码不一致';return}const button=event.target.querySelector('button');button.disabled=true;const response=await fetch('/api/auth/bootstrap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,display_name:document.getElementById('displayName').value,password})});if(response.ok){location.reload();return}const data=await response.json();document.getElementById('message').textContent=data.detail||'创建失败';button.disabled=false});</script></body></html>
