# 已退役的通用 Playwright MCP 实验配置，仅保留历史排障参考。
# 当前 worker 不加载本文件，也不使用同目录旧 IDE 的 mcp_config.json。
# 生产侦察由 server/agent_recon.py 加载 server/recon_runtime.cordis.yml，
# 并挂载项目 server.recon_browser_mcp；实际运行入口见 docs/operations.md。
# 下方 payload 是旧实验原件，不能据此安装全局 profile 或替换生产配置。
- insert:
    - id: mcp-playwright
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: playwright
        transport: stdio
        command: node
        args:
          - !!js process.env.PLAYWRIGHT_MCP_CLI
          - '--isolated'
          - '--browser'
          - 'chromium'
          - '--executable-path'
          - !!js process.env.CHROME_PATH
          # WAF 站点如需 headed：删掉下面这行，并在服务器上以 Xvfb 启动
          - '--headless'
        # 置 true 使启动失败响亮报错，而不是再次静默降级
        failOnStartupError: true
        toolCallTimeoutMs: 120000
